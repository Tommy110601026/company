<div class="inquiry-modal" id="inquiryModal">

    <div
        class="inquiry-overlay"
        id="closeInquiryModal"></div>

    <div class="inquiry-container">

        <button
            class="inquiry-close"
            id="closeInquiryBtn">

            ×

        </button>

        <div class="inquiry-info">

            <div class="inquiry-kicker">
                EnviroValor
            </div>

            <h2>
                Contact Us
            </h2>

            <p>
                Contact us for quotations, samples, catalogs, or OEM cooperation discussions.
            </p>

            <ul class="inquiry-points">

                <li>✓ Fast Response</li>
                <li>✓ Sample Available</li>
                <li>✓ OEM Discussion</li>
                <li>✓ Taiwan Supplier</li>

            </ul>

        </div>

        <div class="inquiry-form-wrap">

            <form class="inquiry-form">

                <div class="form-group">

                    <label>
                        Inquiry Purpose *
                    </label>

                    <select>

                        <option>
                            Request Quotation
                        </option>

                        <option>
                            Request Sample
                        </option>

                        <option>
                            Request Product Catalog
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>
                        Company Name *
                    </label>

                    <input type="text">

                </div>

                <div class="form-group">

                    <label>
                        Email *
                    </label>

                    <input type="email">

                </div>

                <div class="form-group">

                    <label>
                        Message
                    </label>

                    <textarea rows="5"></textarea>

                </div>

                <button
                    type="submit"
                    class="submit-btn">

                    Send Inquiry

                </button>

            </form>

        </div>

    </div>

</div>
