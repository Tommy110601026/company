<div class="inquiry-modal" id="inquiryModal">

    <div
        class="inquiry-overlay"
        id="closeInquiryModal"></div>

    <div class="inquiry-container">

        <button
            class="inquiry-close"
            id="closeInquiryBtn">

            ×

        </button>

        <div class="inquiry-info">

            <div class="inquiry-kicker">
                EnviroValor
            </div>

            <h2>
                Contact Us
            </h2>

            <p>
                Contact us for quotations, samples, catalogs, or OEM cooperation discussions.
            </p>

            <ul class="inquiry-points">

                <li>✓ Fast Response</li>
                <li>✓ Sample Available</li>
                <li>✓ OEM Discussion</li>
                <li>✓ Taiwan Supplier</li>

            </ul>

        </div>

        <div class="inquiry-form-wrap">

            <form class="inquiry-form">

                <input
                    type="text"
                    name="website"
                    class="form-honeypot"
                    tabindex="-1"
                    autocomplete="off">

                <div class="form-group">
            
                    <label>
                        Inquiry Purpose *
                    </label>
            
                    <select name="inquiryType">
            
                        <option>
                            Request Quotation
                        </option>
            
                        <option>
                            Request Sample
                        </option>
            
                        <option>
                            Request Product Catalog
                        </option>
            
                    </select>
            
                </div>
            
                <div class="form-group">
            
                    <label>
                        Company Name *
                    </label>
            
                    <input
                        type="text"
                        name="company"
                        required>
            
                </div>
            
                <div class="form-group">
            
                    <label>
                        Email *
                    </label>
            
                    <input
                        type="email"
                        name="email"
                        required>
            
                </div>
            
                <div class="form-group">
            
                    <label for="subject">
            
                        Subject *
            
                    </label>
            
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter subject"
                        required>
            
                </div>
            
                <div class="form-group">
            
                    <label>
                        Message *
                    </label>
            
                    <textarea
                        name="message"
                        rows="5"
                        maxlength="3000"
                        placeholder="Enter your message, maximum 3000 characters"
                        required></textarea>

                    <div class="form-hint">
                        <span class="message-count">0</span> / 3000 characters
                    </div>
            
                </div>
            
                <button
                    type="submit"
                    class="submit-btn">
            
                    Send Inquiry
            
                </button>
            
            </form>

        </div>

    </div>

</div>
