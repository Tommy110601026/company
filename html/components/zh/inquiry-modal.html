<div
    class="inquiry-modal"
    id="inquiryModal">

    <div
        class="inquiry-overlay"
        id="closeInquiryModal"></div>

    <div class="inquiry-container">

        <button
            class="inquiry-close"
            id="closeInquiryBtn">

            ×

        </button>

        <div class="inquiry-info">

            <div class="inquiry-kicker">
                EnviroValor
            </div>

            <h2>
                聯絡我們
            </h2>

            <p>
                歡迎與我們聯繫產品詢價、樣品需求、型錄索取或 OEM 合作。
            </p>

            <ul class="inquiry-points inquiry-contact">

                <li><strong>聯絡資訊</strong></li>
                <li>Tom Yeh<br>國際業務經理</li>
                <li>Email：<a href="mailto:tom@envirovalor.com">tom@envirovalor.com</a></li>
                <li>WhatsApp / LINE：<a href="tel:+886933626495">+886-933-626-495</a></li>

            </ul>

        </div>

        <div class="inquiry-form-wrap">

            <form class="inquiry-form" novalidate>

            <div
                class="form-alert"
                id="formAlert">

                <div class="form-alert-title">
                    ⚠️ 請確認表單內容
                </div>

                <div class="form-alert-message">
                    以下欄位需要修正：
                </div>

                <ul class="form-alert-list"></ul>

            </div>

                <input
                    type="text"
                    name="website"
                    class="form-honeypot"
                    tabindex="-1"
                    autocomplete="off">

                <div class="form-group">
            
                    <label>
                        詢問項目 *
                    </label>
            
                    <select name="inquiryType">
            
                        <option>
                            詢價需求
                        </option>
            
                        <option>
                            樣品需求
                        </option>
            
                        <option>
                            索取產品型錄
                        </option>
            
                    </select>
            
                </div>
            
                <div class="form-group">
            
                    <label>
                        公司名稱 *
                    </label>
            
                    <input
                        type="text"
                        name="company"
                        required>
            
                </div>
            
                <div class="form-group">
            
                    <label>
                        電子郵件 *
                    </label>
            
                    <input
                        type="email"
                        name="email"
                        required>
            
                </div>
            
                <div class="form-group">
            
                    <label for="subject">
            
                        主旨 *
            
                    </label>
            
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="請輸入主旨"
                        required>
            
                </div>
            
                <div class="form-group">
            
                    <label>
                        留言內容 *
                    </label>
            
                    <textarea
                        name="message"
                        rows="5"
                        placeholder="請輸入留言內容，最多3000字"
                        required></textarea>

                    <div class="form-hint">
                        <span class="message-count">0</span> / 3000 字
                    </div>
            
                </div>
            
                <button
                    type="submit"
                    class="submit-btn">
            
                    送出詢問
            
                </button>
            
            </form>
        </div>

    </div>

</div>
