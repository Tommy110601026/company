<div
    class="inquiry-modal"
    id="inquiryModal">

    <div
        class="inquiry-overlay"
        id="closeInquiryModal"></div>

    <div class="inquiry-container">

        <button
            class="inquiry-close"
            id="closeInquiryBtn">

            ×

        </button>

        <div class="inquiry-info">

            <div class="inquiry-kicker">
                EnviroValor
            </div>

            <h2>
                聯絡我們
            </h2>

            <p>
                歡迎與我們聯繫產品詢價、樣品需求、型錄索取或 OEM 合作。
            </p>

            <ul class="inquiry-points">

                <li>✓ 快速回覆</li>
                <li>✓ 提供樣品</li>
                <li>✓ OEM 合作討論</li>
                <li>✓ 台灣供應商</li>

            </ul>

        </div>

        <div class="inquiry-form-wrap">

            <form class="inquiry-form">

                <div class="form-group">
            
                    <label>
                        詢問項目 *
                    </label>
            
                    <select name="inquiryType">
            
                        <option>
                            詢價需求
                        </option>
            
                        <option>
                            樣品需求
                        </option>
            
                        <option>
                            索取產品型錄
                        </option>
            
                    </select>
            
                </div>
            
                <div class="form-group">
            
                    <label>
                        公司名稱 *
                    </label>
            
                    <input
                        type="text"
                        name="company"
                        required>
            
                </div>
            
                <div class="form-group">
            
                    <label>
                        電子郵件 *
                    </label>
            
                    <input
                        type="email"
                        name="email"
                        required>
            
                </div>
            
                <div class="form-group">
            
                    <label for="subject">
            
                        主旨 *
            
                    </label>
            
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="請輸入主旨"
                        required>
            
                </div>
            
                <div class="form-group">
            
                    <label>
                        留言內容 *
                    </label>
            
                    <textarea
                        name="message"
                        rows="5"
                        required></textarea>
            
                </div>
            
                <button
                    type="submit"
                    class="submit-btn">
            
                    送出詢問
            
                </button>
            
            </form>
        </div>

    </div>

</div>
