<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        EnviroValor | Wastewater Aeration Solutions
    </title>

    <meta
        name="description"
        content="EnviroValor supplies fine bubble disc diffusers and tube diffusers for wastewater treatment systems and industrial aeration applications."
    />

    <meta
        name="robots"
        content="index, follow"
    />

    <link
        rel="canonical"
        href="https://www.envirovalor.com/"
    />

    <meta
        property="og:type"
        content="website"
    />

    <meta
        property="og:site_name"
        content="EnviroValor"
    />

    <meta
        property="og:url"
        content="https://www.envirovalor.com/"
    />

    <meta
        property="og:image"
        content="https://www.envirovalor.com/images/logo.jpg"
    />

    <!-- Favicon：Google 搜尋結果需要「正方形」且「網址固定」的圖示。
         原本用的 logo.jpg 是 1170×1166、slogo.jpg 是 449×514，
         兩者都不是正方形，Google 因此改顯示預設的地球圖示。
         favicon.svg 是由 logo 置中裁切成 512×512 的正方形版本。
         這一頁是首頁，Google 主要就是從這裡讀 favicon。 -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">

    <script>
        const userLang =
            navigator.language ||
            navigator.userLanguage;

        const targetUrl =
            userLang && userLang.startsWith("zh")
                ? "/html/zh/index.html"
                : "/html/en/index.html";

        window.location.replace(targetUrl);
    </script>

</head>

<body>

    <p>
        Redirecting...
    </p>

    <noscript>

        <p>
            JavaScript is disabled. Please choose a language:
        </p>

        <ul>

            <li>
                <a href="/html/en/index.html">
                    English
                </a>
            </li>

            <li>
                <a href="/html/zh/index.html">
                    繁體中文
                </a>
            </li>

        </ul>

    </noscript>

</body>

</html>
