<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>EnviroValor 後台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

    <!-- 載入中：確認登入狀態前先不顯示任何畫面，避免閃一下登入頁 -->
    <div class="boot" id="bootView">載入中…</div>


    <!-- =========================
         登入
    ========================= -->
    <main class="login" id="loginView" hidden>

        <form class="login-card" id="loginForm" novalidate>

            <img class="login-logo" src="/images/slogo.jpg" alt="EnviroValor">

            <h1>型錄管理後台</h1>

            <label class="field">
                <span>Email</span>
                <input type="email" name="email" autocomplete="username" required>
            </label>

            <label class="field">
                <span>密碼</span>
                <input type="password" name="password" autocomplete="current-password" required>
            </label>

            <p class="form-error" id="loginError" role="alert" hidden></p>

            <button class="btn btn-primary btn-block" type="submit">登入</button>

            <p class="login-hint">忘記密碼請聯絡網站管理員</p>

        </form>

    </main>


    <!-- =========================
         型錄列表
    ========================= -->
    <div class="app" id="appView" hidden>

        <header class="topbar">

            <div class="topbar-brand">
                <img src="/images/slogo.jpg" alt="">
                <span>型錄管理後台</span>
            </div>

            <div class="topbar-actions">
                <a class="btn btn-ghost" href="/html/zh/download.html" target="_blank" rel="noopener">查看網站</a>
                <button class="btn btn-ghost" type="button" id="logoutBtn">登出</button>
            </div>

        </header>

        <main class="content">

            <div class="content-head">

                <div>
                    <h1>型錄下載</h1>
                    <p class="muted">這裡的內容會顯示在網站的「型錄下載」頁（中文版與英文版）。</p>
                </div>

                <button class="btn btn-primary" type="button" id="addBtn">＋ 新增型錄</button>

            </div>

            <ol class="item-list" id="itemList"></ol>

            <p class="empty" id="emptyState" hidden>目前還沒有任何型錄，按「＋ 新增型錄」開始上傳。</p>

        </main>

    </div>


    <!-- =========================
         新增／編輯
    ========================= -->
    <dialog class="editor" id="editor">

        <form id="editorForm" novalidate>

            <header class="editor-head">
                <h2 id="editorTitle">新增型錄</h2>
                <button class="icon-btn" type="button" data-close aria-label="關閉">✕</button>
            </header>

            <div class="editor-body">

                <!-- 檔案 -->
                <section class="group">

                    <h3>檔案</h3>

                    <label class="dropzone" id="dropzone">
                        <input type="file" name="file" id="fileInput"
                            accept=".pdf,.doc,.docx,.xls,.xlsx,.zip">
                        <span class="dropzone-main" id="fileLabel">點這裡選擇檔案，或把檔案拖進來</span>
                        <span class="dropzone-sub">支援 PDF、Word、Excel、ZIP，單檔 50 MB 以內</span>
                    </label>

                    <p class="current-file" id="currentFile" hidden></p>

                </section>

                <!-- 中文 -->
                <section class="group">

                    <h3>中文版內容</h3>

                    <label class="field">
                        <span>標題 <em>必填</em></span>
                        <input type="text" name="title_zh" maxlength="40" required>
                        <small class="counter" data-for="title_zh"></small>
                    </label>

                    <label class="field">
                        <span>說明</span>
                        <textarea name="description_zh" rows="3" maxlength="150"></textarea>
                        <small class="counter" data-for="description_zh"></small>
                    </label>

                    <label class="field">
                        <span>重點條列 <small>一行一點，最多 6 點</small></span>
                        <textarea name="highlights_zh" rows="4" data-max-lines="6" data-max-line-length="40"></textarea>
                        <small class="counter" data-for="highlights_zh"></small>
                    </label>

                </section>

                <!-- 英文 -->
                <section class="group">

                    <h3>英文版內容</h3>

                    <label class="field">
                        <span>Title <em>必填</em></span>
                        <input type="text" name="title_en" maxlength="80" required>
                        <small class="counter" data-for="title_en"></small>
                    </label>

                    <label class="field">
                        <span>Description</span>
                        <textarea name="description_en" rows="3" maxlength="300"></textarea>
                        <small class="counter" data-for="description_en"></small>
                    </label>

                    <label class="field">
                        <span>Highlights <small>一行一點，最多 6 點</small></span>
                        <textarea name="highlights_en" rows="4" data-max-lines="6" data-max-line-length="80"></textarea>
                        <small class="counter" data-for="highlights_en"></small>
                    </label>

                </section>

                <!-- 設定 -->
                <section class="group">

                    <h3>設定</h3>

                    <label class="field field-inline">
                        <span>上傳日期</span>
                        <input type="date" name="upload_date" required>
                    </label>

                    <label class="switch">
                        <input type="checkbox" name="published" checked>
                        <span class="switch-track" aria-hidden="true"></span>
                        <span>顯示在網站上</span>
                    </label>

                </section>

                <p class="form-error" id="editorError" role="alert" hidden></p>

            </div>

            <footer class="editor-foot">
                <button class="btn btn-ghost" type="button" data-close>取消</button>
                <button class="btn btn-primary" type="submit" id="saveBtn">儲存</button>
            </footer>

        </form>

    </dialog>


    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/admin/admin.js"></script>

</body>
</html>
